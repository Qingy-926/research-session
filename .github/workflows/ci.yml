name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  offline:
    name: offline (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest==8.3.4

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q skills scripts tests tools

      - name: Skill discovery and contracts
        run: python -m pytest tests/test_dual_host.py tests/test_contracts.py tests/test_run_manifest.py -q

      - name: Collect tests
        run: python -m pytest tests skills/research-session/tests --collect-only -q

      - name: Offline test suite
        run: python -m pytest tests skills/research-session/tests -q

      - name: Golden evaluations
        run: python -m pytest tests/golden -q

      - name: Documentation consistency
        run: python -m pytest tests/test_docs_consistency.py -q

      - name: Privacy scan
        run: python -m pytest tests/test_public_core.py -q

      - name: Build deterministic release package
        run: python tools/package_release.py --out dist

      - name: Show package checksum
        run: python -c "import pathlib; print(''.join(p.read_text(encoding='utf-8') for p in sorted(pathlib.Path('dist').glob('*.sha256'))), end='')"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: research-session-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  ci-ok:
    name: ci-ok
    needs: offline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every offline matrix job to succeed
        run: |
          echo "offline result: ${{ needs.offline.result }}"
          if [ "${{ needs.offline.result }}" != "success" ]; then
            echo "::error::offline matrix did not fully succeed (failure, cancellation, or skip)"
            exit 1
          fi
