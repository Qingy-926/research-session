name: live-provider

# Manual only and unverified: no live-marked tests exist in this tree yet.
# It validates secret wiring for a future explicit-provider run. Do not add
# push or pull_request triggers here.

on:
  workflow_dispatch:
    inputs:
      provider_url:
        description: "Explicit Responses endpoint (https://.../responses)"
        required: true
      model:
        description: "Wire model name"
        required: true

permissions:
  contents: read

jobs:
  live:
    name: live provider (manual, unverified)
    runs-on: ubuntu-latest
    env:
      RESEARCH_SESSION_ALLOW_LIVE: "1"
      RESEARCH_SESSION_LIVE_API_KEY: ${{ secrets.RESEARCH_SESSION_LIVE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest==8.3.4

      - name: Require repository secret
        run: |
          if [ -z "$RESEARCH_SESSION_LIVE_API_KEY" ]; then
            echo "::error::RESEARCH_SESSION_LIVE_API_KEY secret is not set"
            exit 1
          fi

      - name: Write explicit provider config
        env:
          PROVIDER_URL: ${{ inputs.provider_url }}
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "url": os.environ["PROVIDER_URL"],
              "model": os.environ["MODEL"],
              "provider": "manual-live",
              "api_key_env": "RESEARCH_SESSION_LIVE_API_KEY",
          }
          with open("provider-config.live.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle)
          PY

      - name: Run live-marked tests when they exist
        env:
          RESEARCH_SESSION_PROVIDER_CONFIG: provider-config.live.json
        run: |
          set +e
          python -m pytest tests -m live -q
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "::notice::No live-marked tests exist in this tree yet; only secret wiring was validated."
            exit 0
          fi
          exit "$status"
